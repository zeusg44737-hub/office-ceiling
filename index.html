<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CTI Executive Suites | Premium 3D Office Layout</title>
<meta name="description" content="CTI Executive Suites - Luxury interactive 3D office interior layout with furniture, lighting and AC plan (all sizes in cm).">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a24d;--navy:#0e1a2b;--ink:#f4efe3;--card:#0e1a2bdd;--bd:#c9a24d88;--bg:#efede7}
html,body{height:100%;margin:0;background:var(--navy);font-family:Inter,system-ui,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(180deg,#0e1a2bf2,#0e1a2bcc);border-bottom:1px solid var(--gold);color:var(--ink)}
header h1{margin:0;font:700 clamp(18px,5vw,26px) 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
header p{margin:2px 0 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.bar{position:fixed;left:0;right:0;top:calc(66px + env(safe-area-inset-top,0px));display:flex;gap:6px;padding:8px;flex-wrap:wrap}
button{background:var(--card);color:var(--ink);border:1px solid var(--gold);border-radius:999px;padding:7px 14px;font:600 12px Inter,Arial,sans-serif;letter-spacing:.04em}
button:active{background:var(--gold);color:var(--navy)}
#leg{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:32%;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;font-size:12px}
#leg div{display:flex;align-items:center;gap:8px;padding:2px 0}
#leg i{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid #fff6}
#leg b{margin-left:auto;white-space:nowrap;color:var(--gold)}
</style></head><body>
<header><h1>CTI Executive Suites</h1><p>Premium 3D Office Interior Layout</p></header>
<canvas id="c"></canvas>
<div class="bar"><button id="top">From above</button><button id="iso">3D view</button><button id="sz">Sizes: ON</button><button id="zi">Zoom +</button><button id="zo">Zoom −</button><button id="fb">From below</button><button id="cl">Lights/AC: ON</button><button id="lg">Legend</button></div>
<div id="leg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=778,D=882,cv=document.getElementById('c');
const dark=false;
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(devicePixelRatio);
const S=new THREE.Scene();S.background=new THREE.Color(dark?0x1e1f22:0xefede7);
const cam=new THREE.PerspectiveCamera(40,1,10,10000);
S.add(new THREE.AmbientLight(0xffffff,.75));const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(-300,900,500);S.add(dl);
const root=new THREE.Group();root.position.set(-W/2,0,-D/2);S.add(root);
const C={desk:0xc98b4f,chair:0x333a45,vchair:0x2a9d8f,sofa:0x7a8ca8,counter:0xf4f1ea,panel:0xe07a2f,plant:0x3f9e4a,sani:0x9fd3ea,fridge:0xb8bcc2,part:0x66c2d9};
const NAME={desk:'Desk / Table',chair:'Staff chair',vchair:'Visitor chair',sofa:'Sofa set',counter:'Counter / Basin / WC',panel:'CTI wall panel',plant:'Plant',fridge:'Fridge',part:'Glass partition'};
const used={};const lab=new THREE.Group(),rl=new THREE.Group();root.add(lab,rl);
function label(t,x,y,z,g,w=110,col='#111',bg='rgba(255,255,255,.85)'){const c=document.createElement('canvas');c.width=256;c.height=64;const x2=c.getContext('2d');x2.fillStyle=bg;x2.fillRect(0,0,256,64);x2.fillStyle=col;x2.font='bold 30px Arial';x2.textAlign='center';x2.textBaseline='middle';x2.fillText(t,128,34);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(w,w/4,1);s.position.set(x,y,z);s.renderOrder=9;g.add(s);}
function add(type,x,z,w,d,h,y0=0,l=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:C[type],transparent:type=='part',opacity:type=='part'?.4:1}));
m.position.set(x+w/2,y0+h/2,z+d/2);root.add(m);m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x00000055})));
if(l){(used[type]=used[type]||new Set()).add(w+'×'+d);label(w+'×'+d,x+w/2,y0+h+10,z+d/2,lab,Math.max(60,Math.min(w,110)))}return m}
function chair(x,z,back,t='chair'){add(t,x-22,z-22,45,45,8,42);add(t,x-3,z-3,6,6,42,0,false);
const b={n:[x-22,z-22,45,6],s:[x-22,z+16,45,6],w:[x-22,z-22,6,45],e:[x+16,z-22,6,45]}[back];add(t,b[0],b[1],b[2],b[3],40,50,false)}
function plant(x,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(15,12,70,12),new THREE.MeshLambertMaterial({color:C.plant}));m.position.set(x,35,z);root.add(m);(used.plant=used.plant||new Set()).add('Ø30×70')}
// floor + room labels (original layout)
const rooms=[['Workstation',0,0,427,648],['Manager 2',427,0,351,302],['Manager 1',427,302,351,346],['Reception',0,648,414,234],['Kitchen',414,648,212,234],['Washroom',626,648,152,234]];
const fm=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshLambertMaterial({color:dark?0x34363b:0xffffff,side:THREE.DoubleSide}));fm.rotation.x=-Math.PI/2;fm.position.set(W/2,0,D/2);root.add(fm);
rooms.forEach(([n,x,z,w,d])=>label(n+' '+w+'×'+d+' cm',x+w/2,3,z+d/2+(n=='Workstation'?-20:30),rl,150,'#555','rgba(255,255,255,.7)'));
label('882 cm',-30,3,D/2,rl,90,'#555','rgba(255,255,255,.7)');label('778 cm',W/2,3,D+30,rl,90,'#555','rgba(255,255,255,.7)');
const wm=new THREE.MeshLambertMaterial({color:0xaaaaaa,transparent:true,opacity:.22,side:THREE.DoubleSide});
function wall(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,270,d),wm);m.position.set(x+w/2,135,z+d/2);root.add(m);m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x888888})))}
wall(-12,0,12,D);wall(W,0,12,D);wall(0,-12,W,12);wall(0,D,270,12);wall(360,D,W-360,12);wall(427,0,8,648);wall(427,296,351,12);wall(427,648,351,8);wall(414,648,8,234);wall(626,648,8,234);
// ---- FURNITURE (placed as in the render)
// Workstation: 6 desks (3 columns x 2) + chairs
[10,153,297].forEach(x=>{add('desk',x,225,120,60,75);add('desk',x,295,120,60,75);add('part',x,285,120,4,110,0,false);chair(x+60,203,'n');chair(x+60,377,'s')});
// left & right corner tables + chairs + plants
add('desk',30,20,120,60,75);add('desk',30,80,60,60,75);chair(120,110,'w');plant(14,30);
add('desk',285,20,120,60,75);add('desk',345,80,60,60,75);chair(310,115,'e');plant(415,30);
// Manager 2 (L desk top-right + chair + plant)
add('desk',600,25,150,60,75);add('desk',690,85,60,70,75);chair(645,125,'w');plant(762,30);
// Manager 1 (L desk + chair + 2 plants)
add('desk',560,372,170,60,75);add('desk',670,432,60,80,75);chair(600,470,'s');plant(755,325);plant(762,580);
// Reception: CTI wood panel, U counter, chair, plants
add('panel',5,652,195,8,230);add('panel',5,652,8,200,230,0,false);
add('counter',31,763,30,99,105);add('counter',31,805,160,57,105,0,false);add('counter',122,731,69,60,105);chair(90,765,'e');
plant(218,762);plant(218,845);plant(367,860);
// Kitchen: counter + sink / Washroom: basin + WC
add('counter',418,660,50,200,90);add('counter',428,700,30,40,8,90);
add('counter',745,690,30,45,85);add('counter',735,775,40,60,40);add('counter',735,815,40,20,80,0,false);
// ---- CEILING LAYER (original lights / AC / points, same colours)
const ce=new THREE.Group();root.add(ce);
function ceil(x,z,w,d,col,op=1){const m=new THREE.Mesh(new THREE.BoxGeometry(w,4,d),new THREE.MeshLambertMaterial({color:col,transparent:true,opacity:op}));m.position.set(x,268,z);m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x00000044})));ce.add(m)}
function dot(x,z,col,r=6){const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),new THREE.MeshBasicMaterial({color:col}));m.position.set(x,268,z);ce.add(m)}
[[113,93],[310,93],[110,226],[309,226],[105,386],[308,386],[102,527],[306,527],[504,66],[691,66],[506,221],[695,223],[507,367],[699,367],[509,552],[703,552],[58,700],[293,700],[522,744]].forEach(p=>ceil(p[0],p[1],60,60,0xfad6a0,.8));
[[211,86,45,30],[202,534,45,30],[601,231,42,26],[606,559,42,26],[38,808,42,26]].forEach(p=>ceil(...p.slice(0,2),p[2],p[3],0x4a86d6));
[[112,159],[310,159],[105,455],[307,455],[598,57],[603,355],[174,677]].forEach(p=>ceil(p[0],p[1],26,27,0x66b2f2));
[[210,160],[205,456],[599,143],[604,459],[604,459],[172,754],[523,835]].forEach(p=>dot(p[0],p[1],0xe8606a));
[[208,231],[206,382],[496,143],[498,459],[231,799]].forEach(p=>dot(p[0],p[1],0x9b8cf0));
ceil(206,306,40,14,0x7cb342);ceil(332,867,50,16,0x3bb5a0);dot(712,751,0xf2d94e,8);dot(715,830,0x999999,8);
{const g=new THREE.BufferGeometry().setFromPoints([[26,37],[382,37],[382,591],[26,591]].map(p=>new THREE.Vector3(p[0],268,p[1])));ce.add(new THREE.LineLoop(g,new THREE.LineBasicMaterial({color:0xf0b44c})))}
// ---- camera controls
let th=0,ph=.02,rad=1500;
function upd(){cam.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,0,0)}
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rad=Math.max(rad,0)}
addEventListener('resize',size);size();upd();
const P=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);pd=0});
cv.addEventListener('pointerup',e=>P.delete(e.pointerId));cv.addEventListener('pointercancel',e=>P.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);
if(P.size==1){th-=(e.clientX-o[0])*.008;ph=Math.min(3.12,Math.max(.02,ph-(e.clientY-o[1])*.008));P.set(e.pointerId,[e.clientX,e.clientY])}
else{P.set(e.pointerId,[e.clientX,e.clientY]);const a=[...P.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)rad=Math.min(4000,Math.max(300,rad*pd/d));pd=d}upd()});
cv.addEventListener('wheel',e=>{rad=Math.min(4000,Math.max(300,rad*(1+e.deltaY*.001)));upd()},{passive:true});
const $=id=>document.getElementById(id);
$('top').onclick=()=>{th=0;ph=.02;rad=1500;upd()};$('fb').onclick=()=>{th=0;ph=3.12;rad=1500;upd()};$('cl').onclick=()=>{ce.visible=!ce.visible;$('cl').textContent='Lights/AC: '+(ce.visible?'ON':'OFF')};
$('iso').onclick=()=>{th=-.6;ph=.95;rad=1500;upd()};
$('zi').onclick=()=>{rad=Math.max(300,rad*.8);upd()};$('zo').onclick=()=>{rad=Math.min(4000,rad*1.25);upd()};
$('sz').onclick=()=>{lab.visible=!lab.visible;$('sz').textContent='Sizes: '+(lab.visible?'ON':'OFF')};
$('lg').onclick=()=>{const l=$('leg');l.style.display=l.style.display=='none'?'block':'none'};
// legend
$('leg').innerHTML='<div><b style="margin:0">Total 778 × 882 cm. Sizes in cm (W×D). Ceiling: Amber = LED panels and cove, Blue = AC, other dots = original points</b></div>'+Object.keys(used).map(k=>`<div><i style="background:#${C[k].toString(16).padStart(6,'0')}"></i>${NAME[k]}<b>${[...used[k]].join(', ')}</b></div>`).join('');
(function loop(){requestAnimationFrame(loop);R.render(S,cam)})();
</script></body></html>
